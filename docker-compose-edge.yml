services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./data/config/Caddyfile:/etc/caddy/Caddyfile
      - ./data/config/caddy_data:/data
      - ./data/config/caddy_config:/config
      - ./data/frontend_dist:/usr/share/caddy
    networks:
      - chem_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Сам туннель Cloudflare
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    env_file:
      - .env
    command: tunnel run --protocol http2
    networks:
      - chem_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - ./data/config/loki-config.yml:/etc/loki/local-config.yaml
      - ./data/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - chem_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Сборщик логов из Docker
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./data/config/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
#      - /var/log:/var/log:ro если логи не появятся пробросить на линуксе
#      - /run/log/journal:/run/log/journal:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - chem_network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.20'

  # Визуализация
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - ./data/grafana:/var/lib/grafana
    networks:
      - chem_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - '--allow_dynamic_housekeeping=true'
      - '--housekeeping_interval=10s' # Чтобы не частил и не грузил CPU
      - '--docker_only=true'
    devices:
      - /dev/kmsg # Позволяет cAdvisor лучше понимать состояние ядра
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro # РЕШАЕТ ТВОЮ ОШИБКУ
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro # ЗАПАСНОЙ ВАРИАНТ
    networks:
      - chem_network
    deploy:
      resources:
        limits:
          memory: 256M   # cAdvisor обычно ест 100-150МБ, 256МБ — безопасный запас
          cpus: '0.30'

    # Хранилище метрик
  prometheus:
      image: prom/prometheus:latest
      container_name: prometheus
      restart: unless-stopped
      volumes:
        - ./data/config/prometheus.yml:/etc/prometheus/prometheus.yml
        - ./data/prometheus_data:/prometheus
      command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--storage.tsdb.retention.time=15d' # Храним метрики 15 дней
      networks:
        - chem_network
      deploy:
        resources:
          limits:
            memory: 2G     # Prometheus любит RAM. 1ГБ хватит для хранения данных за 15 дней
            cpus: '1.0'

  redis:
    image: redis:alpine
    container_name: openchem_redis
    restart: always
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - chem_network

networks:
  chem_network:
    external: true

